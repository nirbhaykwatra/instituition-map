<div class="institutions-container">
    <h1 class="institutions-header admin-content-header">Manage Institutions</h1>
    <div class="institutions-content">
        <form class="institutions-content-add-body-input-form" method="post">
            <div class="institutions-content-add">
                <div class="institutions-content-add-header section-header">Add Institution</div>
                <div>
                    <label class="institutions-content-add-body-input-label text-input-label" for="institution-type">Institution Type</label>
                    <select class="institutions-content-add-body-input text-input" id="institution-type" name="institutionType">
                        <option value="postsec">Post Secondary</option>
                        <option value="industry">Industry Partner</option>
                        <option value="school">School</option>
                    </select>
                </div>
                
                <div>
                    <label class="institutions-content-add-body-input-label text-input-label" for="institution-name">Name</label>
                    <input class="institutions-content-add-body-input text-input" type="text" id="institution-name" name="institutionName" placeholder="Institution Name">
                </div>
                
                <div>
                    <label class="institutions-content-add-body-input-label text-input-label" for="institution-address">Address</label>
                    <input class="institutions-content-add-body-input text-input" type="text" id="institution-address" name="institutionAddress" placeholder="Institution Address">
                </div>
                <div>
                    <label class="institutions-content-add-body-input-label text-input-label" for="institution-contact">Contact</label>
                    <input class="institutions-content-add-body-input text-input" type="text" id="institution-contact" name="institutionContact" placeholder="Institution Contact">
                </div>
                <div>
                    <label class="institutions-content-add-body-input-label text-input-label" for="institution-latitude">Latitude</label>
                    <input class="institutions-content-add-body-input text-input" type="number" id="institution-latitude" name="institutionLat" placeholder="Latitude">
                </div>
                <div>
                    <label class="institutions-content-add-body-input-label text-input-label" for="institution-longitude">Longitude</label>
                    <input class="institutions-content-add-body-input text-input" type="number" id="institution-longitude" name="institutionLong" placeholder="Longitude">
                </div>
                <div>
                    <button class="institutions-content-add-body-input-button login-button" value="OK" type="submit">Add Institution</button>
                </div>
            </div>
        </form>
        <form class="institutions-content-remove-body-input-form" method="post">
            <div class="institutions-content-remove">
                <div class="institutions-content-remove-header section-header">Remove Institution</div>
                <div>
                    <label class="institutions-content-remove-body-input-label text-input-label" for="institution">Institution Type</label>
                    <select class="institutions-content-remove-body-input text-input" id="institution" name="institution">
                        <option value="postsec">Post Secondary</option>
                        <option value="industry">Industry Partner</option>
                        <option value="school">School</option>
                    </select>
                </div>
                <div></div>
                <div></div>
                <div></div>
                <div>
                    <button class="institutions-content-remove-body-input-button login-button" value="OK" type="submit">Remove Institution</button>
                </div>
            </div>
        </form>
        <form class="institutions-content-edit-body-input-form" method="post">
            <div class="institutions-content-edit">
                <div class="institutions-content-edit-header section-header">Edit Institution</div>
                <div>
                    <label class="institutions-content-edit-body-input-label text-input-label" for="edit-institution-type">Institution Type</label>
                    <select class="institutions-content-edit-body-input text-input" id="edit-institution-type" name="institutionType">
                        <option value="postsec">Post Secondary</option>
                        <option value="industry">Industry Partner</option>
                        <option value="school">School</option>
                    </select>
                </div>

                <div>
                    <label class="institutions-content-edit-body-input-label text-input-label" for="edit-institution-name">Name</label>
                    <input class="institutions-content-edit-body-input text-input" type="text" id="edit-institution-name" name="institutionName" placeholder="Institution Name">
                </div>

                <div>
                    <label class="institutions-content-edit-body-input-label text-input-label" for="edit-institution-address">Address</label>
                    <input class="institutions-content-edit-body-input text-input" type="text" id="edit-institution-address" name="institutionAddress" placeholder="Institution Address">
                </div>
                <div>
                    <label class="institutions-content-edit-body-input-label text-input-label" for="edit-institution-contact">Contact</label>
                    <input class="institutions-content-edit-body-input text-input" type="text" id="edit-institution-contact" name="institutionContact" placeholder="Institution Contact">
                </div>
                <div>
                    <button class="institutions-content-edit-body-input-button login-button" value="OK" type="submit">Edit Institution</button>
                </div>
            </div>
        </form>
    </div>
</div>
