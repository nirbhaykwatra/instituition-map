<div class="institutions-container">
    <h1 class="institutions-header admin-content-header">Manage Institutions</h1>
    <div class="institutions-content">
        <div class="institutions-content-add">
            <div class="institutions-content-add-header section-header">Add Institution</div>
            <div class="institutions-content-add-body">
                <div class="institutions-content-add-body-input-container">
                    <form class="institutions-content-add-body-input-form" method="post">
                        <label class="institutions-content-add-body-input-label text-input-label" for="institution-type">Institution Type</label>
                        <select class="institutions-content-add-body-input text-input" id="institution-type" name="institution-type">
                            <option value="postsec">Post Secondary</option>
                            <option value="industry">Industry Partner</option>
                            <option value="school">School</option>
                        </select>
                        <label class="institutions-content-add-body-input-label text-input-label" for="institution-name">Name</label>
                        <input class="institutions-content-add-body-input text-input" type="text" id="institution-name" name="institution-name" placeholder="Institution Name">
                        <label class="institutions-content-add-body-input-label text-input-label" for="institution-address">Address</label>
                        <input class="institutions-content-add-body-input text-input" type="text" id="institution-address" name="institution-address" placeholder="Institution Address">
                        <label class="institutions-content-add-body-input-label text-input-label" for="institution-contact">Contact</label>
                        <input class="institutions-content-add-body-input text-input" type="text" id="institution-contact" name="institution-contact" placeholder="Institution Contact">
                        <button class="institutions-content-add-body-input-button login-button" value="OK" type="submit">Add Institution</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="institutions-content-remove">
            <div class="institutions-content-add-header section-header">Add Institution</div>
            <div class="institutions-content-add-body">
                <div class="institutions-content-add-body-input-container">
                    <form class="institutions-content-add-body-input-form" method="post">
                        <label class="institutions-content-add-body-input-label text-input-label" for="institution-type">Institution Type</label>
                        <select class="institutions-content-add-body-input text-input" id="institution-type" name="institution-type">
                            <option value="postsec">Post Secondary</option>
                            <option value="industry">Industry Partner</option>
                            <option value="school">School</option>
                        </select>
                        <label class="institutions-content-add-body-input-label text-input-label" for="institution-name">Name</label>
                        <input class="institutions-content-add-body-input text-input" type="text" id="institution-name" name="institution-name" placeholder="Institution Name">
                        <label class="institutions-content-add-body-input-label text-input-label" for="institution-address">Address</label>
                        <input class="institutions-content-add-body-input text-input" type="text" id="institution-address" name="institution-address" placeholder="Institution Address">
                        <label class="institutions-content-add-body-input-label text-input-label" for="institution-contact">Contact</label>
                        <input class="institutions-content-add-body-input text-input" type="text" id="institution-contact" name="institution-contact" placeholder="Institution Contact">
                        <button class="institutions-content-add-body-input-button login-button" value="OK" type="submit">Add Institution</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="institutions-content-edit">
            <div class="institutions-content-add-header section-header">Add Institution</div>
            <div class="institutions-content-add-body">
                <div class="institutions-content-add-body-input-container">
                    <form class="institutions-content-add-body-input-form" method="post">
                        <label class="institutions-content-add-body-input-label text-input-label" for="institution-type">Institution Type</label>
                        <select class="institutions-content-add-body-input text-input" id="institution-type" name="institution-type">
                            <option value="postsec">Post Secondary</option>
                            <option value="industry">Industry Partner</option>
                            <option value="school">School</option>
                        </select>
                        <label class="institutions-content-add-body-input-label text-input-label" for="institution-name">Name</label>
                        <input class="institutions-content-add-body-input text-input" type="text" id="institution-name" name="institution-name" placeholder="Institution Name">
                        <label class="institutions-content-add-body-input-label text-input-label" for="institution-address">Address</label>
                        <input class="institutions-content-add-body-input text-input" type="text" id="institution-address" name="institution-address" placeholder="Institution Address">
                        <label class="institutions-content-add-body-input-label text-input-label" for="institution-contact">Contact</label>
                        <input class="institutions-content-add-body-input text-input" type="text" id="institution-contact" name="institution-contact" placeholder="Institution Contact">
                        <button class="institutions-content-add-body-input-button login-button" value="OK" type="submit">Add Institution</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
