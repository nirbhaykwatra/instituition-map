<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?
                    family=Albert+Sans:ital,wght@0,100..900;1,100..900
                    &family=Montserrat:ital,wght@0,100..900;1,100..900
                    &family=Open+Sans:ital,wght@0,300..800;1,300..800
                    &family=Playfair+Display:ital,wght@0,400..900;1,400..900
                    &display=swap" rel="stylesheet">
    <script src="https://use.fontawesome.com/releases/v6.2.0/js/all.js"></script>
    <script src="adminLogin.js" type="module"></script>
    <title>Admin</title>
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <div class="login-header-container">
                <h1 class="login-header">Admin Login</h1>
            </div>
            <form class="login-form" method="post">
                <div class="login-input-container">
                    <label class="login-input-username-label" for="username">Username</label>
                    <input class="login-input-username" type="text" id="username" name="username" placeholder="Username" autocomplete="username">
                    <label class="login-input-password-label" for="password">Password</label>
                    <input class="login-input-password" type="password" id="password" name="password" placeholder="Password" autocomplete="password">
                </div>
                <div class="login-button-container">
                    <button class="login-button" value="OK" type="submit">Login</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
