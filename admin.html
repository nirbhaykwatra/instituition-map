<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?
                    family=Albert+Sans:ital,wght@0,100..900;1,100..900
                    &family=Montserrat:ital,wght@0,100..900;1,100..900
                    &family=Open+Sans:ital,wght@0,300..800;1,300..800
                    &family=Playfair+Display:ital,wght@0,400..900;1,400..900
                    &display=swap" rel="stylesheet">
    <script src="https://use.fontawesome.com/releases/v6.2.0/js/all.js"></script>
    <title>Login</title>
</head>
<body>
<div class="admin-page">
    <div class="admin-container">
        <div class="admin-header-container">
            <h1 class="admin-header">Admin</h1>
        </div>
        <form class="admin-form" method="post">
            <div class="admin-input-container">
                <label class="admin-input-username-label">
                    Name: <input class="admin-input-username" type="text" placeholder="Name">
                </label>
                <label class="admin-input-password-label">
                    Location: <input class="admin-input-password" type="text" placeholder="Location">
                </label>
            </div>
            <div class="admin-button-container">
                <button class="admin-button" value="OK">Add marker</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
